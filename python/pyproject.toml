[project]
name = "tvc-lander"
version = "0.1.0"
description = "Neural network based MPC controller for a rocket landing scenario"
authors = [{ name = "Akkshay Sundara Rajan", email = "sundar57@purdue.edu" }]
requires-python = "==3.12.*"
readme = "../README.md"
dependencies = [
    "numpy>=2.3.1,<3.0.0",
    "pandas>=2.3.0,<3.0.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "torch==2.7.1",
    "onnx>=1.18.0,<2.0.0",
    "onnxscript>=0.3.2,<0.4.0",
    "maturin>=1.9.1,<2.0.0",
    "standard-imghdr>=3.13.0,<4.0.0",
    "pygame>=2.6.1,<3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch_cpu" }

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.maturin]
bindings = "pyo3"
manifest-path = "../gym/Cargo.toml"

[build-system]
requires = ["maturin>=1.9.1,<2.0.0"]
build-backend = "maturin"
